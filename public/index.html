<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone Location Tracker</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold text-center mb-8">Phone Location Tracker</h1>
        
        <div class="max-w-md mx-auto bg-white rounded-lg shadow-md p-6">
            <form id="trackForm" class="space-y-4">
                <div>
                    <label for="phone" class="block text-sm font-medium text-gray-700">Phone Number</label>
                    <input type="tel" id="phone" name="phone" required
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border">
                </div>
                
                <div class="flex items-center">
                    <input id="consent" name="consent" type="checkbox" required
                        class="h-4 w-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                    <label for="consent" class="ml-2 block text-sm text-gray-700">
                        I consent to location tracking (demo only - mock data will be used)
                    </label>
                </div>
                
                <button type="submit" 
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
                    Track Location
                </button>
            </form>
            
            <div id="result" class="mt-6 hidden">
                <h2 class="text-xl font-semibold mb-2">Location Information</h2>
                <div class="bg-gray-50 p-4 rounded-md">
                    <p id="locationInfo" class="text-gray-800"></p>
                    <div id="map" class="mt-4 h-48 bg-gray-200 rounded-md flex items-center justify-center">
                        <i class="fas fa-map-marker-alt text-4xl text-red-500"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
